services:
  # Dockerfile で起動する常駐 Express サーバー。
  # DATABASE_URL を設定すれば外部 MySQL を使い、未設定ならコンテナ同梱の
  # MariaDB とデモシードで起動する（無料プランは再起動でデータが消える）。
  - type: web
    name: keiba-kachisuji-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: devin/1787386562-keiba-kachisuji-web
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: VITE_APP_ID
        value: keiba-kachisuji-web
      # 以下は Render のダッシュボードで値を設定する（リポジトリには保存しない）
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
